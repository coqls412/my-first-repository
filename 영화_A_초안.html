<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 영화 티어리스트</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --text: #242629;
      --muted: #858991;
      --line: #e7e8eb;
      --shadow: 0 8px 28px rgba(25, 30, 40, .045);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", "Noto Sans KR", sans-serif;
      letter-spacing: -.025em;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 54px 0 72px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 34px; }
    .eyebrow { color: #92969d; font-size: 11px; font-weight: 700; letter-spacing: .16em; margin: 0 0 10px; }
    h1 { margin: 0; font-size: clamp(27px, 4vw, 38px); letter-spacing: -.055em; font-weight: 750; }
    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .count { color: #777c84; font-size: 13px; white-space: nowrap; padding-bottom: 5px; }
    .count strong { color: var(--text); font-size: 17px; margin-right: 3px; }
    .add-panel {
      display: flex; gap: 10px; padding: 14px; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
      margin-bottom: 28px;
    }
    .add-panel input {
      flex: 1; min-width: 0; border: 0; outline: 0; padding: 9px 10px;
      color: var(--text); background: transparent; font-size: 15px;
    }
    .add-panel input::placeholder { color: #a6a9af; }
    .primary {
      border: 0; background: #25272b; color: white; border-radius: 12px;
      padding: 11px 19px; font-weight: 650; transition: background .18s, transform .18s;
    }
    .primary:hover { background: #44474d; transform: translateY(-1px); }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 13px; }
    .section-heading h2 { margin: 0; font-size: 15px; font-weight: 750; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .tiers { display: grid; gap: 12px; }
    .tier {
      display: grid; grid-template-columns: 68px 1fr; gap: 14px; align-items: stretch;
      min-height: 142px;
    }
    .tier-label {
      display: flex; align-items: center; justify-content: center; border-radius: 15px;
      font-size: 24px; font-weight: 800; color: #35383d;
    }
    .tier[data-tier="S"] .tier-label { background: #eee5ca; }
    .tier[data-tier="A"] .tier-label { background: #e0e9df; }
    .tier[data-tier="B"] .tier-label { background: #e0e8f1; }
    .tier[data-tier="C"] .tier-label { background: #eae3ef; }
    .tier[data-tier="D"] .tier-label { background: #e8e9eb; }
    .dropzone {
      min-width: 0; display: flex; align-content: flex-start; align-items: flex-start;
      flex-wrap: wrap; gap: 12px; padding: 13px; border: 1px solid var(--line);
      border-radius: 15px; background: rgba(255,255,255,.72); transition: background .18s, border-color .18s;
    }
    .dropzone.drag-over, .unranked-list.drag-over {
      background: #f0f2f5; border-color: #9da3ad; border-style: dashed;
    }
    .empty-hint { color: #b0b3b9; font-size: 12px; padding: 10px 4px; align-self: center; }
    .movie {
      position: relative; width: 108px; min-height: 120px; padding: 0;
      border: 1px solid #e8e9ec; border-radius: 11px; background: #fff;
      overflow: hidden; box-shadow: 0 3px 10px rgba(20,25,35,.035);
      cursor: grab; user-select: none; transition: transform .16s, box-shadow .16s, opacity .16s;
    }
    .movie:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(20,25,35,.09); }
    .movie:active { cursor: grabbing; }
    .movie.dragging { opacity: .38; }
    .poster-placeholder {
      height: 78px; display: flex; align-items: center; justify-content: center;
      padding: 10px; color: #7f858e; text-align: center; font-size: 11px;
      line-height: 1.45; background: linear-gradient(145deg, #f1f2f4, #e7e9ec);
    }
    .movie-title {
      display: block; padding: 9px 8px 10px; min-height: 40px; font-size: 11px;
      line-height: 1.45; font-weight: 650; overflow-wrap: anywhere; text-align: center;
    }
    .movie-actions {
      position: absolute; top: 5px; right: 5px; display: flex; gap: 3px;
      opacity: 0; transition: opacity .15s;
    }
    .movie:hover .movie-actions, .movie:focus-within .movie-actions { opacity: 1; }
    .icon-btn {
      display: grid; place-items: center; width: 23px; height: 23px; padding: 0;
      border: 0; border-radius: 7px; background: rgba(255,255,255,.94);
      color: #4e535b; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .icon-btn:hover { background: #25272b; color: white; }
    .unranked { margin-top: 34px; }
    .unranked-list {
      min-height: 145px; display: flex; flex-wrap: wrap; align-content: flex-start;
      gap: 12px; padding: 14px; border: 1px dashed #d9dce1; border-radius: 15px;
      background: rgba(255,255,255,.55); transition: background .18s, border-color .18s;
    }
    .unranked-list:empty::after {
      content: "아직 등록한 영화가 없어요. 위에서 영화 제목을 입력해 주세요.";
      align-self: center; color: #a7abb2; font-size: 12px; padding: 10px 4px;
    }
    .note { margin: 18px 2px 0; color: #969ba3; font-size: 11px; line-height: 1.7; }
    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
      padding: 11px 16px; border-radius: 999px; background: #292c31; color: white;
      font-size: 12px; opacity: 0; pointer-events: none; transition: .2s; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .modal-backdrop {
      position: fixed; inset: 0; display: none; place-items: center; padding: 20px;
      background: rgba(25,28,33,.34); z-index: 5;
    }
    .modal-backdrop.open { display: grid; }
    .modal {
      width: min(390px, 100%); padding: 23px; border-radius: 18px;
      background: white; box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }
    .modal h3 { margin: 0 0 17px; font-size: 18px; }
    .modal input {
      width: 100%; padding: 12px 13px; border: 1px solid var(--line);
      border-radius: 10px; outline: none; font-size: 14px;
    }
    .modal input:focus { border-color: #9299a4; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; }
    .secondary {
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
      background: white; color: #555a62; font-weight: 600;
    }
    .secondary:hover { background: #f5f6f7; }
    @media (max-width: 620px) {
      .wrap { width: min(100% - 26px, 1120px); padding-top: 34px; }
      header { align-items: flex-start; }
      .count { font-size: 11px; }
      .tier { grid-template-columns: 46px 1fr; gap: 8px; min-height: 126px; }
      .tier-label { border-radius: 12px; font-size: 20px; }
      .dropzone, .unranked-list { gap: 8px; padding: 9px; }
      .movie { width: 88px; min-height: 108px; }
      .poster-placeholder { height: 69px; font-size: 10px; }
      .movie-title { font-size: 10px; padding: 7px 5px; }
      .movie-actions { opacity: 1; }
      .add-panel { padding: 9px; }
      .primary { padding: 10px 13px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <p class="eyebrow">MY PERSONAL MOVIE COLLECTION</p>
        <h1>나의 영화 티어리스트</h1>
        <p class="subtitle">좋아하는 영화들을 나만의 기준으로 정리해 보세요.</p>
      </div>
      <div class="count"><strong id="movieCount">0</strong>편 등록</div>
    </header>

    <form class="add-panel" id="addForm">
      <input id="movieInput" type="text" maxlength="100" placeholder="등록할 영화 제목을 입력해 주세요." autocomplete="off" aria-label="영화 제목">
      <button class="primary" type="submit">영화 추가</button>
    </form>

    <section aria-labelledby="tierHeading">
      <div class="section-heading">
        <h2 id="tierHeading">나의 티어</h2>
        <span>영화 카드를 끌어 원하는 티어에 놓아 보세요.</span>
      </div>
      <div class="tiers" id="tiers">
        <section class="tier" data-tier="S" aria-label="S 티어">
          <div class="tier-label">S</div><div class="dropzone" data-drop="S"></div>
        </section>
        <section class="tier" data-tier="A" aria-label="A 티어">
          <div class="tier-label">A</div><div class="dropzone" data-drop="A"></div>
        </section>
        <section class="tier" data-tier="B" aria-label="B 티어">
          <div class="tier-label">B</div><div class="dropzone" data-drop="B"></div>
        </section>
        <section class="tier" data-tier="C" aria-label="C 티어">
          <div class="tier-label">C</div><div class="dropzone" data-drop="C"></div>
        </section>
        <section class="tier" data-tier="D" aria-label="D 티어">
          <div class="tier-label">D</div><div class="dropzone" data-drop="D"></div>
        </section>
      </div>
    </section>

    <section class="unranked" aria-labelledby="unrankedHeading">
      <div class="section-heading">
        <h2 id="unrankedHeading">미분류 영화</h2>
        <span>아직 티어를 정하지 않은 영화</span>
      </div>
      <div class="unranked-list" id="unranked" data-drop="unranked"></div>
    </section>

    <p class="note">영화 목록과 티어 배치는 이 브라우저에 자동 저장됩니다. 같은 브라우저에서 다시 열면 기록을 이어서 볼 수 있어요.</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editHeading">
    <form class="modal" id="editForm">
      <h3 id="editHeading">영화 제목 수정</h3>
      <input id="editInput" type="text" maxlength="100" aria-label="수정할 영화 제목">
      <div class="modal-actions">
        <button class="secondary" type="button" id="cancelEdit">취소</button>
        <button class="primary" type="submit">저장</button>
      </div>
    </form>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "my-movie-tier-list-v1";
      const tiers = ["S", "A", "B", "C", "D"];
      const form = document.getElementById("addForm");
      const input = document.getElementById("movieInput");
      const unranked = document.getElementById("unranked");
      const count = document.getElementById("movieCount");
      const toast = document.getElementById("toast");
      const modal = document.getElementById("editModal");
      const editForm = document.getElementById("editForm");
      const editInput = document.getElementById("editInput");
      let movies = loadMovies();
      let editingId = null;
      let draggedId = null;
      let toastTimer = null;

      function loadMovies() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          if (!Array.isArray(saved)) return [];
          return saved.filter(m => m && typeof m.id === "string" &&
            typeof m.title === "string" &&
            (m.tier === null || tiers.includes(m.tier)));
        } catch {
          return [];
        }
      }

      function saveMovies() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
        } catch {
          showToast("저장할 수 없어요. 브라우저 저장 공간을 확인해 주세요.");
        }
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function makeId() {
        return (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : "movie-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      }

      function createMovieCard(movie) {
        const card = document.createElement("article");
        card.className = "movie";
        card.draggable = true;
        card.dataset.id = movie.id;
        card.setAttribute("aria-label", movie.title + " 영화 카드. 드래그하여 티어 이동");

        const poster = document.createElement("div");
        poster.className = "poster-placeholder";
        poster.textContent = "영화 포스터";

        const title = document.createElement("span");
        title.className = "movie-title";
        title.textContent = movie.title;
        title.title = movie.title;

        const actions = document.createElement("div");
        actions.className = "movie-actions";

        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "icon-btn";
        edit.textContent = "수정";
        edit.setAttribute("aria-label", movie.title + " 제목 수정");
        edit.addEventListener("click", event => {
          event.stopPropagation();
          openEdit(movie.id);
        });

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "icon-btn";
        remove.textContent = "삭제";
        remove.setAttribute("aria-label", movie.title + " 삭제");
        remove.addEventListener("click", event => {
          event.stopPropagation();
          deleteMovie(movie.id);
        });

        actions.append(edit, remove);
        card.append(poster, title, actions);
        card.addEventListener("dragstart", event => {
          draggedId = movie.id;
          card.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", movie.id);
        });
        card.addEventListener("dragend", () => {
          draggedId = null;
          card.classList.remove("dragging");
          document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
        });
        return card;
      }

      function render() {
        document.querySelectorAll(".dropzone").forEach(zone => zone.replaceChildren());
        unranked.replaceChildren();

        for (const movie of movies) {
          const card = createMovieCard(movie);
          const destination = movie.tier
            ? document.querySelector('[data-drop="' + movie.tier + '"]')
            : unranked;
          if (destination) destination.appendChild(card);
        }

        document.querySelectorAll(".dropzone").forEach(zone => {
          if (!zone.children.length) {
            const hint = document.createElement("span");
            hint.className = "empty-hint";
            hint.textContent = "영화를 여기에 놓아 주세요.";
            zone.appendChild(hint);
          }
        });

        count.textContent = String(movies.length);
      }

      function addMovie(title) {
        const cleanTitle = title.trim();
        if (!cleanTitle) {
          showToast("영화 제목을 입력해 주세요.");
          input.focus();
          return;
        }
        if (movies.some(m => m.title.toLocaleLowerCase() === cleanTitle.toLocaleLowerCase())) {
          showToast("이미 등록한 영화예요.");
          input.focus();
          return;
        }
        movies.push({ id: makeId(), title: cleanTitle, tier: null });
        saveMovies();
        render();
        input.value = "";
        input.focus();
        showToast("영화를 등록했어요.");
      }

      function openEdit(id) {
        const movie = movies.find(m => m.id === id);
        if (!movie) return;
        editingId = id;
        editInput.value = movie.title;
        modal.classList.add("open");
        editInput.focus();
        editInput.select();
      }

      function closeEdit() {
        modal.classList.remove("open");
        editingId = null;
      }

      function deleteMovie(id) {
        const movie = movies.find(m => m.id === id);
        if (!movie) return;
        if (!confirm('"' + movie.title + '" 영화를 삭제할까요?')) return;
        movies = movies.filter(m => m.id !== id);
        saveMovies();
        render();
        showToast("영화를 삭제했어요.");
      }

      function moveMovie(id, tier) {
        const movie = movies.find(m => m.id === id);
        if (!movie) return;
        movie.tier = tier;
        saveMovies();
        render();
        showToast(tier ? tier + " 티어로 이동했어요." : "미분류 목록으로 이동했어요.");
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        addMovie(input.value);
      });

      editForm.addEventListener("submit", event => {
        event.preventDefault();
        const movie = movies.find(m => m.id === editingId);
        const newTitle = editInput.value.trim();
        if (!movie) return closeEdit();
        if (!newTitle) {
          showToast("영화 제목을 입력해 주세요.");
          editInput.focus();
          return;
        }
        if (movies.some(m => m.id !== editingId &&
          m.title.toLocaleLowerCase() === newTitle.toLocaleLowerCase())) {
          showToast("같은 제목의 영화가 이미 등록되어 있어요.");
          editInput.focus();
          return;
        }
        movie.title = newTitle;
        saveMovies();
        render();
        closeEdit();
        showToast("영화 제목을 수정했어요.");
      });

      document.getElementById("cancelEdit").addEventListener("click", closeEdit);
      modal.addEventListener("click", event => {
        if (event.target === modal) closeEdit();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && modal.classList.contains("open")) closeEdit();
      });

      document.querySelectorAll("[data-drop]").forEach(zone => {
        zone.addEventListener("dragover", event => {
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          zone.classList.add("drag-over");
        });
        zone.addEventListener("dragleave", event => {
          if (!zone.contains(event.relatedTarget)) zone.classList.remove("drag-over");
        });
        zone.addEventListener("drop", event => {
          event.preventDefault();
          zone.classList.remove("drag-over");
          const id = event.dataTransfer.getData("text/plain") || draggedId;
          const targetTier = zone.dataset.drop === "unranked" ? null : zone.dataset.drop;
          if (id) moveMovie(id, targetTier);
        });
      });

      render();
    })();
  </script>
</body>
</html>
